name: Daily Finance Bulletin Automation

on:
  schedule:
    # 05:00 UTC corresponds to 08:00 AM Turkey Time (UTC+3) - Morning Turkey & Global Bulletin
    - cron: '0 5 * * *'
    # 13:00 UTC corresponds to 16:00 PM Turkey Time (UTC+3) - Afternoon US Wall Street Bulletin
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      bulletin_type:
        description: 'Bülten Tipi (morning / us / all)'
        required: true
        default: 'all'

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Morning Bulletin (08:00 TR Time)
        if: github.event.schedule == '0 5 * * *' || github.event.inputs.bulletin_type == 'morning' || github.event.inputs.bulletin_type == 'all' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: node index.js

      - name: Run US Wall Street Bulletin (16:00 TR Time)
        if: github.event.schedule == '0 13 * * *' || github.event.inputs.bulletin_type == 'us' || github.event.inputs.bulletin_type == 'all' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: node us_index.js
