name: Morning Turkey Finance Bulletin (08:00 TR)

on:
  schedule:
    # 05:00 UTC corresponds to 08:00 AM Turkey Time (UTC+3)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  send-morning-bulletin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Morning Bulletin Engine (08:00 TR Time)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: node index.js
